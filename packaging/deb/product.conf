LONGDESC=' RetailA2Z is a free, open-source retail point-of-sale and inventory app.
 This package installs a systemd service that runs the published, version-pinned
 RetailA2Z containers with Docker Compose and keeps the SQLite database in a
 Docker volume on this machine. Open http://localhost:1994 after installing.
 .
 Settings are in /etc/nodedr-pos/nodedr-pos.env. Upgrade with apt; back up your
 data first.'
